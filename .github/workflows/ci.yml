name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          problem-matcher: true
          cache: gradle

      - name: Test, lint and build
        run: ./gradlew --no-daemon :core:asha:test :app:lintDebug :app:assembleDebug
